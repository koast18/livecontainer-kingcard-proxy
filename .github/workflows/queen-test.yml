name: Queen Native Smoke Test

on:
  push:
    branches: ['feature/queen-proxy-v2']
  workflow_dispatch:
    inputs:
      phone:
        description: 'TokenInfoReq 手机号'
        required: false
        default: '18812341234'

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check WUP endpoint reachability
        run: |
          curl -sv --max-time 10 http://qbwup.qq.com:8080/ -o /dev/null || true

      - name: Run reference Python fetch_q_token
        run: |
          set -euo pipefail
          PHONE="${{ github.event.inputs.phone }}"
          PHONE="${PHONE:-18812341234}"
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r Tools/queen_proxy_kit/requirements.txt
          python3 Tools/queen_proxy_kit/fetch_q_token.py --phone "$PHONE" --timeout 10 --max-attempts 1

      - name: Compile and run native Queen client
        run: |
          set -euo pipefail
          bash Scripts/test_queen_client.sh "${{ github.event.inputs.phone }}"
