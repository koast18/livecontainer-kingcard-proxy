name: Queen Native Smoke Test

on:
  push:
    branches: ['feature/queen-proxy-v2']
  workflow_dispatch:
    inputs:
      phone:
        description: 'TokenInfoReq 手机号'
        required: false
        default: '18812341234'

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run native Queen client
        run: |
          set -euo pipefail
          bash Scripts/test_queen_client.sh "${{ github.event.inputs.phone }}"
