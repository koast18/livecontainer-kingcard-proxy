name: Debug Async Test

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reproduce async proxy test with full output
        run: |
          set +e
          cc -v > /tmp/cc_version.txt 2>&1
          bash Scripts/test_async_proxy.sh > /tmp/async_out.txt 2>&1
          RC=$?
          echo "====== test_async_proxy.sh exit code: $RC" | tee -a /tmp/async_out.txt
          cat /tmp/async_out.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: async-diag
          path: |
            /tmp/async_out.txt
            /tmp/cc_version.txt